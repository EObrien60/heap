<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>heap</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="/favicon.svg" alt="" width="20" height="20" />heap</div>
    <button id="spaceChip" class="space-chip" title="Switch space (⌘K)"><span class="dot"></span><span id="spaceName">…</span></button>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search the heap…  ( / )" autocomplete="off" spellcheck="false" />
      <span id="count" class="count"></span>
      <button id="scopeToggle" class="scope-toggle" title="Toggle search across all spaces (⌘\)">all</button>
    </div>
  </header>

  <div class="paste-hint" id="pasteHint">
    Paste anything (⌘V) — text or image — or type below and hit ⌘↵
  </div>

  <div class="composer">
    <textarea id="composer" placeholder="Drop a quick note, query, snippet…  (⌘↵ to save)"
      rows="2" spellcheck="false"></textarea>
    <button id="addBtn" title="Save (⌘↵)">Save</button>
  </div>

  <div class="resume-bar" id="resumeBar">
    <span class="resume-label">▸ where I left off</span>
    <div class="resume-text" id="resumeText" contenteditable="true"></div>
  </div>

  <main id="list" class="list" tabindex="0"></main>

  <div id="toast" class="toast"></div>

  <div id="palette" class="palette-overlay" hidden>
    <div class="palette">
      <input id="paletteInput" type="text" placeholder="Jump to space, or type a command…" autocomplete="off" spellcheck="false" />
      <div id="paletteList" class="palette-list"></div>
    </div>
  </div>

  <div id="modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-msg" id="modalMsg"></div>
      <input id="modalInput" class="modal-input" type="text" autocomplete="off" spellcheck="false" hidden />
      <div class="modal-actions">
        <button id="modalCancel" class="modal-btn">Cancel</button>
        <button id="modalOk" class="modal-btn primary">OK</button>
      </div>
    </div>
  </div>

  <footer class="help">
    <span><kbd>/</kbd> search</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
    <span><kbd>↵</kbd> copy</span>
    <span><kbd>p</kbd> pin</span>
    <span><kbd>e</kbd> edit</span>
    <span><kbd>⌫</kbd> delete</span>
    <span><kbd>⌘V</kbd> paste in</span>
    <span><kbd>⌘K</kbd> spaces</span>
    <span><kbd>⌘1</kbd>–<kbd>9</kbd> jump</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
